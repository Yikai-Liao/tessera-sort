name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.changes.outputs.rust }}
      cpp: ${{ steps.changes.outputs.cpp }}
      cpp_present: ${{ steps.changes.outputs.cpp_present }}
      python: ${{ steps.changes.outputs.python }}
      python_present: ${{ steps.changes.outputs.python_present }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: python3 -m unittest discover -s .github/scripts -p "test_*.py"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Formatting and lints for TypeScript, Vue, CSS, JSON and Python. Both
      # tools are fast, so they check the whole repository on every run.
      - run: npm run lint
      - run: pipx run ruff==0.17.4 format --check
      - run: pipx run ruff==0.17.4 check
      - run: npm run scripts:typecheck
      - run: npm run scripts:test
      - id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/scripts/ci_changes.py --base "$BASE" --head "$HEAD" --out "$GITHUB_OUTPUT"
      - name: Explain deferred C++ checks
        if: steps.changes.outputs.cpp == 'true' && steps.changes.outputs.cpp_present != 'true'
        run: echo 'C++ is planned; checks activate when cpp/CMakeLists.txt is added.' >> "$GITHUB_STEP_SUMMARY"

      - name: Explain deferred Python checks
        if: steps.changes.outputs.python == 'true' && steps.changes.outputs.python_present != 'true'
        run: echo 'Python is planned; checks activate when its pyproject.toml and Cargo.toml are added.' >> "$GITHUB_STEP_SUMMARY"

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    uses: ./.github/workflows/rust-ci.yml

  cpp:
    needs: changes
    if: needs.changes.outputs.cpp == 'true' && needs.changes.outputs.cpp_present == 'true'
    uses: ./.github/workflows/cpp-ci.yml

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true' && needs.changes.outputs.python_present == 'true'
    uses: ./.github/workflows/python-ci.yml

  # The single required check for branch protection. Language jobs are skipped
  # when their paths did not change, so it passes on success or skip and fails
  # on any failure or cancellation.
  ci-ok:
    if: always()
    needs: [changes, rust, cpp, python]
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$NEEDS"
